[project]
name = "automated-text-exam-triage"
version = "0.1.0"
description = "Classificação automática de laudos médicos"
authors = [
    { name = "Jessyca Machado" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.8",
    "joblib==1.4.2",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "kagglehub",
    "pytest==8.3.4",
    "ruff==0.9.7",
]

airflow = [
    "apache-airflow==2.10.5",
]

[tool.uv]
package = false
