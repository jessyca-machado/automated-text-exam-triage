services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automated-text-exam-triage-api
    ports:
      - "8000:8080"
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: automated-text-exam-triage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: automated-text-exam-triage-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: automated-text-exam-triage-airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      PYTHONPATH: "/opt/airflow"
      GOOGLE_APPLICATION_CREDENTIALS: "/opt/airflow/secrets/airflow-deployer.json"
      CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: "/opt/airflow/secrets/airflow-deployer.json"
      CLOUDSDK_CORE_PROJECT: "quantum-balm-260822"
      GCP_PROJECT_ID: "quantum-balm-260822"
      GCP_REGION: "us-central1"
      GCP_BUCKET_NAME: "quantum-balm-260822-medical-models"
      CLOUD_RUN_SERVICE: "medical-exam-api"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./model:/opt/airflow/model
      - ./data:/opt/airflow/data
      - ./artifacts:/opt/airflow/artifacts
      - ./secrets:/opt/airflow/secrets:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring
    command: standalone
    restart: unless-stopped


networks:
  monitoring:


volumes:
  prometheus_data:
  grafana_data:
